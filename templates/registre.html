<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - Banc de Temps</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

    {% include '_flashes.html' %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h2 class="text-center text-success mb-4">Crea el teu compte</h2>
                        <p class="text-center text-muted mb-4">Rebràs 5 hores de saldo inicial de benvinguda!</p>

                        <form method="POST" action="/registre">
                            <div class="mb-3">
                                <label class="form-label text-muted">Nom complet</label>
                                <input type="text" name="nom" class="form-control form-control-lg" placeholder="Com et dius?" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ciutat o Població</label>
                                <select class="form-select" name="ciutat" id="ciutat" required>
                                    <option value="" selected disabled>-- Selecciona on vius --</option>
                                    <option value="Barcelona">Barcelona</option>
                                    <option value="Girona">Girona</option>
                                    <option value="Lleida">Lleida</option>
                                    <option value="Tarragona">Tarragona</option>
                                    <option value="L'Hospitalet de Llobregat">L'Hospitalet de Llobregat</option>
                                    <option value="Badalona">Badalona</option>
                                    <option value="Terrassa">Terrassa</option>
                                    <option value="Sabadell">Sabadell</option>
                                    <option value="Altres">Altres poblacions...</option>
                                </select>
                            </div>
                            <div class="mb-3" id="ciutat_altra_wrapper" style="display:none;">
                                <label class="form-label">Especifica la teva població</label>
                                <input type="text" name="ciutat_altra" class="form-control" placeholder="Escriu el nom de la teva població">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Correu electrònic</label>
                                <input type="email" name="correu" class="form-control form-control-lg" placeholder="nom@exemple.cat" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">Contrasenya</label>
                                <input type="password" name="contrasenya" class="form-control form-control-lg" minlength="6" required>
                                <small class="text-muted">Mínim 6 caràcters.</small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted">Confirma la contrasenya</label>
                                <input type="password" name="contrasenya2" class="form-control form-control-lg" minlength="6" required>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100">Registrar-me ara</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">Ja formes part del banc? <a href="/login" class="text-decoration-none fw-bold text-success">Inicia sessió</a></p>
                        </div>
                        <div class="text-center mt-4">
                            <a href="/normes" class="text-secondary" style="text-decoration: underline;">Llegir les Normes d'Ús</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var select = document.getElementById('ciutat');
            var wrapper = document.getElementById('ciutat_altra_wrapper');
            function actualitza() {
                wrapper.style.display = (select.value === 'Altres') ? 'block' : 'none';
            }
            select.addEventListener('change', actualitza);
            actualitza();
        });
    </script>

</body>
</html>
